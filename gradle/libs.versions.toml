[versions]
# Platform & Server APIs
paper = "[26.2.build,)"
authme = "5.7.0-SNAPSHOT"
nlogin = "2.0"
openlogin = "1.3"

# Metrics & Utilities
bstats = "3.2.1"
faststats = "0.30.1"
folialib = "0.5.1"

# Database & Connection Pooling
mysql = "9.4.0"
sqlite = "3.45.1.0"
hikaricp = "7.1.0"

# Attache Library Loader
attache = "feature-dependency-groups-6c4a415"

# Plugins
shadow = "9.6.1"

[libraries]
# Platform
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

# Soft dependencies
authme = { module = "fr.xephi:authme", version.ref = "authme" }
nlogin = { module = "com.nickuc.login:api", version.ref = "nlogin" }
openlogin = { module = "com.nickuc.openlogin:openlogin-universal", version.ref = "openlogin" }

# Shaded dependencies
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
faststats-bukkit = { module = "dev.faststats.metrics:bukkit", version.ref = "faststats" }
folialib = { module = "com.tcoded:FoliaLib", version.ref = "folialib" }
attache-bukkit = { module = "me.whereareiam:attache-bukkit", version.ref = "attache" }
attache-common = { module = "me.whereareiam:attache-common", version.ref = "attache" }

# Runtime libraries loaded by Attache
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }

[bundles]
attache = ["attache-bukkit", "attache-common"]
database = ["mysql-connector", "sqlite-jdbc", "hikaricp"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
attache = { id = "me.whereareiam.attache", version.ref = "attache" }
